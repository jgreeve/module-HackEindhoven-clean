<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tablette</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #f7f9fb;
        color: #1f2933;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #52606d;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tablette</h1>
      <p>A generative app editor.</p>
      <p>
        <a href="https://docs.tablette.bimr.net/" target="_blank" rel="noopener">
          docs.tablette.bimr.net
        </a>
      </p>
    </main>
  </body>
</html>
